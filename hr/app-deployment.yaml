# fumikun/hr(高専祭シフト調整システム)。Hono(API + ビルド済みSPAの静的配信)の1コンテナ構成。
# DBマイグレーション(drizzle)はinitContainerで毎回実行する(適用済みのものはスキップされる)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr
spec:
  replicas: 1
  # 新Podがreadyになってから旧Podを止める(ダウンタイムなしのローリング更新)。
  # 更新中は旧新2つのPodが同じDBを使うため、マイグレーションは旧バージョンのコードでも
  # 動く後方互換な変更(カラム追加など)にすること。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hr
  template:
    metadata:
      labels:
        app: hr
    spec:
      # preStop(10秒)でTraefikのエンドポイントから外れるのを待ち、その後SIGTERMで
      # アプリが処理中リクエストを完了して終了する分の余裕を含めた猶予時間。
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: migrate
          image: ghcr.io/fumikun/hr:latest
          workingDir: /app/server
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - secretRef:
                name: hr-env
      containers:
        - name: hr
          image: ghcr.io/fumikun/hr:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: hr-env
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          # /api/health が返るまでトラフィックを流さない
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 10
            failureThreshold: 3
