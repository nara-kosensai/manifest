# prod/testで別々だったpgadminを1インスタンスに統合。既存の2ホスト名は
# どちらもこのServiceにルーティングする(認証はCloudflare Access側で行う)。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pgadmin
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`pgadmin.nara-kosensai.com`)
      middlewares:
        - name: security-headers
      services:
        - name: pgadmin
          port: 80
    - kind: Rule
      match: Host(`pgadmin-test.nara-kosensai.com`)
      middlewares:
        - name: security-headers
      services:
        - name: pgadmin
          port: 80
