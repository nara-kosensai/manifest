apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - db.yaml
  - redis.yaml
  - backend.yaml

# infisical-env (ENCRYPTION_KEY, AUTH_SECRET, POSTGRES_*, DB_CONNECTION_URI,
# REDIS_URL, SMTP_*, SITE_URL 等 config/infisical/.env の全内容) は
# infra/README.mdの手順で一度きり手動投入する(gitにコミットしない)。
# 他アプリのCI/CDが依存するInfisical自身の秘密情報を、Infisical経由で
# 取得することはできない(循環依存)ため、このnamespaceの秘密だけは
# 例外的にGitHub Actionsを経由しない手動ブートストラップにしている。
