apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: infisical-db
  template:
    metadata:
      labels:
        app: infisical-db
    spec:
      containers:
        - name: db
          image: postgres:14-alpine
          envFrom:
            - secretRef:
                name: infisical-env
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready --username="$POSTGRES_USER" && psql --username="$POSTGRES_USER" --list
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 10
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: infisical-db
  ports:
    - port: 5432
      targetPort: 5432
