apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical-backend
  template:
    metadata:
      labels:
        app: infisical-backend
    spec:
      containers:
        - name: backend
          image: infisical/infisical:v0.162.6
          envFrom:
            - secretRef:
                name: infisical-env
          env:
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: infisical-backend
  ports:
    - port: 8080
      targetPort: 8080
