# 旧構成の nginx-exporter (nginxのstub_status) はnginx retireに伴い廃止。
# 代わりにTraefikのPrometheusメトリクス(infra/k3s/traefik-config.yamlで
# metrics.prometheus.enabled: trueを設定済み)をスクレイプする。
# ただしTraefik Serviceが実際に9100番を公開しているかはHelmチャートの
# バージョンに依存するため、初回適用後 `kubectl get svc -n kube-system traefik`
# で `metrics` ポートが存在することを確認し、名前/番号が違えば下記を調整すること。
#
# kubernetes-apiservers / kubelet / cadvisor の3ジョブは、Prometheus公式が
# 配布している標準的なin-cluster discoveryレシピ(kubernetes_sd_configs)を
# そのまま使っている。ServiceAccountトークン(自動マウントされる
# /var/run/secrets/kubernetes.io/serviceaccount/{token,ca.crt})でapiserver/
# kubeletのHTTPS APIに認証する。権限は prometheus-rbac.yaml のClusterRole。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
      - job_name: 'traefik'
        static_configs:
          - targets: ['traefik.kube-system.svc.cluster.local:9100']
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']

      # kube-apiserver自体のメトリクス(リクエストレイテンシ、エラー率等)。
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_namespace,
                __meta_kubernetes_service_name,
                __meta_kubernetes_endpoint_port_name,
              ]
            action: keep
            regex: default;kubernetes;https
        # apiserver_request_duration_seconds_bucket等のヒストグラムはverb×resource×
        # code×component×バケット数の掛け算で系列が爆発的に増える最大要因。
        # sum/count(平均値算出には十分)は残し、bucket(パーセンタイル計算用)だけ落とす。
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '(apiserver|etcd)_.*_bucket'
            action: drop

      # kubelet自体のメトリクス(node/kubelet単位の統計)。apiserver経由の
      # プロキシではなく、ノードのkubelet(10250番、単一ノードのため直接到達可)を
      # kubernetes_sd_configsのrole: nodeで自動発見して叩く。
      - job_name: 'kubelet'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        # kubeletが自身に埋め込んでいるclient-go計装(apiserverへのリクエスト状況、
        # 内部workqueue統計)は普段見ないうえヒストグラムでコストが高いためdrop。
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'rest_client_.*|workqueue_.*|apiserver_.*_bucket|storage_operation_duration_seconds_bucket'
            action: drop

      # cAdvisor(Pod/コンテナ単位のCPU/メモリ)。kubeletの/metrics/cadvisorを
      # 同様にrole: nodeで自動発見。
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        # cAdvisorはpod以外のsystemdスライス等のcgroupも含め大量の系列を吐くため、
        # メモリ削減のためpod/container単位の系列だけに絞り、かつ普段使わない
        # 高カーディナリティなmetric familyをここでdropする。
        metric_relabel_configs:
          - source_labels: [pod, container]
            regex: ';|;.*|.*;'
            action: drop
          - source_labels: [__name__]
            regex: 'container_fs_.*|container_network_.*|container_blkio_device_usage_total|container_tasks_state|container_memory_failures_total|container_spec_.*'
            action: drop
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
