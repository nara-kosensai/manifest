apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# web-staticとnetworkはnamespaceが異なるため、それぞれ別のnamespaceを
# 指定するサブディレクトリのkustomizationとしてまとめてある。
resources:
  - web-static
  - network
  - monitoring
  - infisical

images:
  - name: ghcr.io/nara-kosensai/www-archive
    newTag: latest
  - name: ghcr.io/fumikun/2026kosensai-storybook
    newTag: latest
