# App-of-apps: ArgoCD自身にこのディレクトリ(k8s/argocd-apps/)を管理させる。
# これによりplatform-shared-app.yaml等、以降追加するApplication定義もgit経由で
# 反映されるようになる。この1ファイルだけは一度きり手動で
# `kubectl apply -f k8s/argocd-apps/root-app.yaml` してブートストラップする
# (README.md参照)。以後の変更はgit pushだけで反映される。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nara-kosensai/manifest.git
    targetRevision: main
    path: k8s/argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
