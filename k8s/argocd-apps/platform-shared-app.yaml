# monitoring/network/web-static/ingress(config/k8s/overlays/shared)。
# 各サブディレクトリのkustomization.yamlが自身のnamespaceを指定しているため
# destination.namespaceは指定しない。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-shared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nara-kosensai/manifest.git
    targetRevision: main
    path: k8s/overlays/shared
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
