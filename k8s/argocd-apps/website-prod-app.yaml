# website(prod)。イメージタグは2026kosensaiのCI(deploy-prod.yml)がこのoverlay配下の
# kustomization.yamlを書き換えてprodブランチにcommit&pushする。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:fumikun/2026kosensai.git
    targetRevision: prod
    path: infra/k8s/overlays/prod/website
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
