# 旧構成ではdocker-composeの `network_mode: host` で動かしていたnode-exporterを、
# k8s流儀のDaemonSet(hostNetwork+hostPID+hostPathマウント)に置き換える。
# シングルノードなのでPodは実質1つだが、将来ノードが増えても自動的に追随する。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            # Pod毎に生成されるveth/cni仮想NICはnode_network_*の系列数を
            # 際限なく増やすため除外する(ホストの物理/ブリッジIFだけ残す)。
            - --collector.netdev.device-exclude=^(veth.*|cni.*|lo)$
          ports:
            - containerPort: 9100
              hostPort: 9100
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
spec:
  selector:
    app: node-exporter
  ports:
    - port: 9100
      targetPort: 9100
