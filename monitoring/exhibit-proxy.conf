# 展示用ホストとバックエンドの間に挟む書き換えプロキシ(nginx)の設定。
# 来場者に見せる画面から管理用ホスト名(argocd.* / grafana.* など)が分からないよう、
# レスポンス中のホスト名を書き換える(docs/architecture.md「展示用PC向けホスト」)。
# sub_filterは圧縮されたレスポンスを書き換えられないため、どちらもAccept-Encodingを外して
# 非圧縮で受け取る(Cloudflare側で再圧縮される)。
#
# このファイルはkustomizeのconfigMapGeneratorでConfigMapになる。名前にハッシュが付くため、
# 変更するとDeploymentが自動で再起動して反映される。

# exhibit-b: Grafana(公開ダッシュボードのみ。パスの制限はgrafana-route.yamlのIngressRoute)。
# GrafanaはHTMLにappUrl(GF_SERVER_ROOT_URL)を埋め込む。root_urlはGitHub OAuthで使うので
# 変えられないため、ここでドメイン部分だけ置換する(テンプレートが"/"を"\/"にエスケープするため)。
server {
  listen 8080 default_server;
  server_name exhibit-b.nara-kosensai.com;
  server_tokens off;

  location / {
    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_redirect https://grafana.nara-kosensai.com/ /;

    sub_filter_types application/json;  # text/htmlは既定で対象
    sub_filter_once off;
    sub_filter 'grafana.nara-kosensai.com' 'exhibit-b.nara-kosensai.com';
  }
}

# exhibit-c: Traefik Web UI(閲覧専用)。
# Traefikの`web`エントリーポイントへ、管理用ホスト名traefik.*のHostヘッダを付けて
# クラスタ内から直接つなぐ(k3s/traefik-config.yamlのtraefik-dashboard IngressRoute →
# api@internal)。Cloudflare Accessはクラスタ外の入口なので、ここは通らない。
#
# TraefikのAPIは全ルーターのルール(Host(`argocd.nara-kosensai.com`)など)を返すため、
# 公開サイト(nara-kosensai.com / www)以外のホスト名をすべて伏せ字にする。
# 新しいホストをcloudflared-configmap.yamlに足したら、ここにも追加すること。
server {
  listen 8080;
  server_name exhibit-c.nara-kosensai.com;
  server_tokens off;

  location / {
    proxy_pass http://traefik.kube-system.svc.cluster.local:80;
    proxy_http_version 1.1;
    proxy_set_header Host traefik.nara-kosensai.com;
    proxy_set_header Accept-Encoding "";
    proxy_redirect ~^https?://traefik\.nara-kosensai\.com/ /;

    sub_filter_types application/json;
    sub_filter_once off;
    # pgadmin-test.* は test.* より前に書く(長い方を先に一致させるため)
    sub_filter 'pgadmin-test.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'pgadmin.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'test.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'storybook.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'info-check.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'grafana.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'argocd.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'hr.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'traefik.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'exhibit-a.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'exhibit-b.nara-kosensai.com' '*****.nara-kosensai.com';
    sub_filter 'exhibit-c.nara-kosensai.com' '*****.nara-kosensai.com';
  }
}
