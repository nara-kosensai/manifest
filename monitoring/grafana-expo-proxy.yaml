# 展示用ホスト(exhibit-b.*)とGrafanaの間に挟む書き換えプロキシ。
#
# Grafanaは全ページのHTMLにappUrl(GF_SERVER_ROOT_URL = https://grafana.nara-kosensai.com/)
# を埋め込むため、そのまま見せると管理用ホスト名が分かってしまう。root_urlは
# GitHub OAuthのリダイレクト先に使うので変えられないため、展示用ホスト経由の
# レスポンスだけnginxのsub_filterで管理用ホスト名を展示用ホスト名に置き換える
# (Grafanaのテンプレートは"/"を"\/"にエスケープするため、ドメイン部分だけを置換する)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-expo-proxy
data:
  default.conf: |
    server {
      listen 8080;
      server_tokens off;

      location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sub_filterは圧縮されたレスポンスを書き換えられないため、非圧縮で受け取る
        proxy_set_header Accept-Encoding "";
        proxy_redirect https://grafana.nara-kosensai.com/ /;

        sub_filter_types application/json;  # text/htmlは既定で対象
        sub_filter_once off;
        sub_filter 'grafana.nara-kosensai.com' 'exhibit-b.nara-kosensai.com';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-expo-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-expo-proxy
  template:
    metadata:
      labels:
        app: grafana-expo-proxy
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: grafana-expo-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-expo-proxy
spec:
  selector:
    app: grafana-expo-proxy
  ports:
    - port: 8080
      targetPort: 8080
