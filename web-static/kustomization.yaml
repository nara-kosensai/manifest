apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web-static

resources:
  - namespace.yaml
  - ../ingress
  - archive-deployment.yaml
  - archive-service.yaml
  - storybook-deployment.yaml
  - storybook-service.yaml
  - storybook-route.yaml
  - form-preview-deployment.yaml
  - form-preview-service.yaml
  - form-preview-route.yaml

images:
  - name: ghcr.io/nara-kosensai/www-archive
    newTag: latest
  - name: ghcr.io/fumikun/2026kosensai-storybook
    newTag: latest
  - name: ghcr.io/fumikun/kosensai-form-preview
    newTag: latest
