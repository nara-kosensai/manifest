apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: form-preview
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`info-check.nara-kosensai.com`)
      middlewares:
        - name: security-headers
      services:
        - name: form-preview
          port: 80
