etag off;
autoindex off;
add_header X-Frame-Options SAMEORIGIN;
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options nosniff;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https://www.youtube.com; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com;";
add_header Strict-Transport-Security "max-age=63072000" always;


real_ip_header CF-Connecting-IP;


server {
    listen 80;
    listen [::]:80;


    server_name www.nara-kosensai.com nara-kosensai.com;

    if ($host = www.nara-kosensai.com) {
        return 301 https://nara-kosensai.com$request_uri;
    }

    root /var/www/html/;
    index index.html;

    error_page 404 /404.html;
    location = /404.html {
        alias /home/admin/2025/dist/404.html;
        # internal; ← 表示確認したいときはコメントアウト
    }

    location /2026/app/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /2026/app {
        return 301 $scheme://$http_host/2026/app/;
    }

    location /2026/ {
        alias /home/admin/2026/website/dist/;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location = /2026 {
        return 301 $scheme://$http_host/2026/;
    }

    location /2025/ {
        alias /home/admin/2025/dist/;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location /2025 {
        return 301 $scheme://$http_host/2025/;
    }

    location /2024/ {
        #return 302 https://1link.jp/nara_kosensai;

        proxy_pass http://localhost:40000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /2024 {
        return 301 $scheme://$http_host/2024/;
    }

    location = / {
        #return 302 https://1link.jp/nara_kosensai;

        return 301 /2025/;
    }

    location /2021 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2021/;
    }

    location /2016 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2016/;
    }

    location /2015 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2015/;
    }

    location /2014 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2014/;
    }

    location /2013 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2013/;
    }

    location /2012 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2012/;
    }

    location /2011 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2011/;
    }

    location /2010 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2010/;
    }

    location /2009 {
        return 301 https://www.nara-k.ac.jp/kouseisai/2009/;
    }
}


