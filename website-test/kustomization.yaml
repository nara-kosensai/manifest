apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test

# namespace/IngressRouteはapp-test/が保持する(同一namespace testへの
# デプロイのため、namespace.yamlはapp-test側にまとめ、ここでは重複作成しない
# ArgoCDが同一Namespaceを2つのApplicationで管理しようとしてOutOfSync表示に
# なるのを避けるため)。
resources:
- website-deployment.yaml
- website-service.yaml

images:
- name: ghcr.io/fumikun/2026kosensai-website
  newName: ghcr.io/fumikun/2026kosensai-website
  newTag: 3c3bff3725b8924209e30a14cd697dfcbd6c21c4
