# 旧nginx default.conf のルーティングをTraefik IngressRoute/Middlewareとして移植したもの
# (docs/architecture.md「Ingressルーティング(旧nginxからの移植)」参照)。
# 本番ホスト(nara-kosensai.com / www)はCloudflare Origin Authentication(mTLS)経由のため
# entryPointはwebsecure-mtlsを使う。TLSOption(cloudflare-mtls)はnamespace networkで定義。
# cloudflare-origin-cert Secretは引き続きCIがSSH経由で作成する(ArgoCDの管理対象外)。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
spec:
  redirectRegex:
    regex: "^https://www\\.nara-kosensai\\.com(.*)"
    replacement: "https://nara-kosensai.com${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-root
spec:
  redirectRegex:
    regex: "^https://nara-kosensai\\.com/?$"
    replacement: "https://nara-kosensai.com/2026/"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-2026-trailing-slash
spec:
  redirectRegex:
    regex: "^(https://nara-kosensai\\.com/2026(?:/app)?)$"
    replacement: "${1}/"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-2026-prefix
spec:
  addPrefix:
    prefix: /2026
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-2026-app-prefix
spec:
  stripPrefix:
    prefixes:
      - /2026/app
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: archive-html-extension
spec:
  # アーカイブ(www-archive)のnginxは拡張子なしURLを.htmlに解決しないため、
  # /2024/info/access のような直打ちが404になる。/2024/配下で2階層以上(他年度はディレクトリ形式で解決できるため対象外)かつ
  # 拡張子なしのパスのみ .html に書き換える(/2024/info/ 等のディレクトリや
  # アセットには影響しない)。
  replacePathRegex:
    regex: "^(/2024/[^/.]+(?:/[^/.]+)+?)/?$"
    replacement: "${1}.html"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
spec:
  entryPoints:
    - websecure-mtls
  tls:
    secretName: cloudflare-origin-cert
    options:
      name: cloudflare-mtls
      namespace: network
  routes:
    - kind: Rule
      priority: 100
      match: Host(`www.nara-kosensai.com`)
      middlewares:
        - name: www-to-apex
      services:
        - name: frontend
          port: 3000
    - kind: Rule
      priority: 91
      match: Host(`nara-kosensai.com`) && Path(`/`)
      middlewares:
        - name: redirect-root
      services:
        - name: frontend
          port: 3000
    - kind: Rule
      priority: 90
      match: Host(`nara-kosensai.com`) && (Path(`/2026`) || Path(`/2026/app`))
      middlewares:
        - name: redirect-2026-trailing-slash
      services:
        - name: frontend
          port: 3000
    # 管理者向けAPIはクラスタ内(kosensai hr)からだけ使う。外部からは拒否する。
    - kind: Rule
      priority: 86
      match: Host(`nara-kosensai.com`) && PathPrefix(`/2026/app/api/v1/admin/`)
      middlewares:
        - name: deny-external
      services:
        - name: backend
          port: 8080
    # 画像・APIはbackendへ。バックエンドのルートは/api/...なので/2026/appを剥がす(app-testと同じ)。
    - kind: Rule
      priority: 85
      match: Host(`nara-kosensai.com`) && PathPrefix(`/2026/app/api/`)
      middlewares:
        - name: strip-2026-app-prefix
        - name: security-headers
      services:
        - name: backend
          port: 8080
    - kind: Rule
      priority: 80
      match: Host(`nara-kosensai.com`) && PathPrefix(`/2026/app/`)
      middlewares:
        - name: security-headers
      services:
        - name: frontend
          port: 3000
    - kind: Rule
      priority: 60
      match: Host(`nara-kosensai.com`) && PathPrefix(`/2026/`)
      middlewares:
        - name: security-headers
      services:
        - name: website
          port: 80
    - kind: Rule
      priority: 50
      match: Host(`nara-kosensai.com`) && Path(`/404`)
      middlewares:
        - name: security-headers
        - name: add-2026-prefix
      services:
        - name: website
          port: 80
    - kind: Rule
      priority: 10
      match: Host(`nara-kosensai.com`) && PathPrefix(`/`)
      middlewares:
        - name: archive-html-extension
        - name: security-headers
      services:
        - name: www-archive
          namespace: web-static
          port: 80
