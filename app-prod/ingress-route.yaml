# 旧nginx default.conf のルーティングをTraefik IngressRoute/Middlewareとして移植したもの
# (docs/architecture.md「Ingressルーティング(旧nginxからの移植)」参照)。
# 本番ホスト(nara-kosensai.com / www)はCloudflare Origin Authentication(mTLS)経由のため
# entryPointはwebsecure-mtlsを使う。TLSOption(cloudflare-mtls)はnamespace networkで定義。
# cloudflare-origin-cert Secretは引き続きCIがSSH経由で作成する(ArgoCDの管理対象外)。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
spec:
  redirectRegex:
    regex: "^https://www\\.nara-kosensai\\.com(.*)"
    replacement: "https://nara-kosensai.com${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-root
spec:
  redirectRegex:
    regex: "^(https://nara-kosensai\\.com(?:/2026(?:/app)?)?)$"
    replacement: "${1}/"
    permanent: true
---
# TODO: 旧年度(2009-2016, 2021)の外部リダイレクト先(学校公式サイトの実URL)を確認して埋めること。
# 現状はプレースホルダなので、実URLが確定するまでこのMiddlewareは有効化しないこと。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: old-years-redirect
spec:
  redirectRegex:
    regex: "^https://nara-kosensai\\.com/(2009|2010|2011|2012|2013|2014|2015|2016|2021)(/.*)?$"
    replacement: "https://www.nara-k.ac.jp/" # TODO: 要確認
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: archive-404
spec:
  errors:
    status:
      - "404"
    query: /2025/404.html
    service:
      name: www-archive
      namespace: web-static
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
spec:
  entryPoints:
    - websecure-mtls
  tls:
    secretName: cloudflare-origin-cert
    options:
      name: cloudflare-mtls
      namespace: network
  routes:
    - kind: Rule
      priority: 100
      match: Host(`www.nara-kosensai.com`)
      middlewares:
        - name: www-to-apex
      services:
        - name: frontend
          port: 3000
    - kind: Rule
      priority: 90
      match: Host(`nara-kosensai.com`) && (Path(`/`) || Path(`/2026`) || Path(`/2026/app`))
      middlewares:
        - name: redirect-root
      services:
        - name: frontend
          port: 3000
    - kind: Rule
      priority: 80
      match: Host(`nara-kosensai.com`) && PathPrefix(`/2026/app/`)
      middlewares:
        - name: security-headers
      services:
        - name: frontend
          port: 3000
    - kind: Rule
      priority: 70
      match: Host(`nara-kosensai.com`) && PathPrefix(`/2009`, `/2010`, `/2011`, `/2012`, `/2013`, `/2014`, `/2015`, `/2016`, `/2021`)
      middlewares:
        - name: old-years-redirect
      services:
        - name: frontend
          port: 3000
    - kind: Rule
      priority: 60
      match: Host(`nara-kosensai.com`) && PathPrefix(`/2026/`)
      middlewares:
        - name: security-headers
      services:
        - name: website
          port: 80
    - kind: Rule
      priority: 10
      match: Host(`nara-kosensai.com`) && PathPrefix(`/`)
      middlewares:
        - name: security-headers
        - name: archive-404
      services:
        - name: www-archive
          namespace: web-static
          port: 80
