# docker-compose.prod.yml の backend サービスに対応。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/fumikun/2026kosensai-backend:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: app-env
          env:
            # kosensai hr 向けの全得票数API(/api/v1/admin/votes)のトークン。Secret が無ければAPIは無効。
            # 作成: kubectl -n prod create secret generic vote-admin --from-literal=VOTE_ADMIN_TOKEN=$(openssl rand -hex 32)
            - name: VOTE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vote-admin
                  key: VOTE_ADMIN_TOKEN
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
