apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../ingress
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - db-statefulset.yaml
  - db-service.yaml
  - ingress-route.yaml

# app-env(DB/CORS等)・ghcr-pull・cloudflare-origin-cert の各Secretはgit管理せず、
# 2026kosensaiリポジトリのCIがデプロイの都度SSH経由で投入する(ArgoCDの管理対象外)。
images:
  - name: ghcr.io/fumikun/2026kosensai-backend
    newTag: latest
  - name: ghcr.io/fumikun/2026kosensai-frontend
    newTag: latest
