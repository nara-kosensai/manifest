apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
- namespace.yaml
- ../ingress
- backend-deployment.yaml
- backend-service.yaml
- frontend-deployment.yaml
- frontend-service.yaml
- db-statefulset.yaml
- db-service.yaml
- ingress-route.yaml

# app-env(DB/CORS等)・ghcr-pull・cloudflare-origin-cert の各Secretはgit管理せず、
# 2026kosensaiリポジトリのCIがデプロイの都度SSH経由で投入する(ArgoCDの管理対象外)。
images:
- name: ghcr.io/fumikun/2026kosensai-backend
  newName: ghcr.io/fumikun/2026kosensai-backend
  newTag: 6ce69bf83fb8cd2d54a812002ca1403724b9f1a2
- name: ghcr.io/fumikun/2026kosensai-frontend
  newName: ghcr.io/fumikun/2026kosensai-frontend
  newTag: 6ce69bf83fb8cd2d54a812002ca1403724b9f1a2
