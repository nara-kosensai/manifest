apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
- namespace.yaml
- app-env.yaml
- ../ingress
- backend-deployment.yaml
- backend-service.yaml
- frontend-deployment.yaml
- frontend-service.yaml
- db-statefulset.yaml
- db-service.yaml
- ingress-route.yaml

# app-envはapp-env.yamlにハードコード。ghcr-pull・cloudflare-origin-cert の各Secretはgit管理せず、
# 2026kosensaiリポジトリのCIがデプロイの都度SSH経由で投入する(ArgoCDの管理対象外)。
images:
- name: ghcr.io/fumikun/2026kosensai-backend
  newName: ghcr.io/fumikun/2026kosensai-backend
  newTag: 1e7bd6e86d58a46abcdd417b96ae173fbaa0ea17
- name: ghcr.io/fumikun/2026kosensai-frontend
  newName: ghcr.io/fumikun/2026kosensai-frontend
  newTag: cd9a1e6beaa9f9c5e644a1a3dededeae65a706c7
