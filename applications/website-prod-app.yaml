# website(prod)。イメージタグは2026kosensaiのCI(deploy-prod.yml)がwebsite-prod/配下の
# kustomization.yamlを書き換えてこのリポジトリ(manifest)のmainブランチにcommit&pushする。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nara-kosensai/manifest.git
    targetRevision: main
    path: website-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
