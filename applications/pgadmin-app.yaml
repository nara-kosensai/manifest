# prod/test共通の統合pgAdminインスタンス。namespace: pgadmin。
# pgadmin-secrets Secretは引き続きCIがSSH経由で作成する(ArgoCDの管理対象外)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nara-kosensai/manifest.git
    targetRevision: main
    path: pgadmin
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
