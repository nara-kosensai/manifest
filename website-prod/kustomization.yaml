apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

# namespace/IngressRouteはapp-prod/が保持する(同一namespace prodへの
# デプロイのため、namespace.yamlはapp-prod側にまとめ、ここでは重複作成しない
# ArgoCDが同一Namespaceを2つのApplicationで管理しようとしてOutOfSync表示に
# なるのを避けるため)。IngressRouteの定義もapp-prod側にまとめてある。
resources:
- website-deployment.yaml
- website-service.yaml

images:
- name: ghcr.io/fumikun/2026kosensai-website
  newName: ghcr.io/fumikun/2026kosensai-website
  newTag:  b947b28c648aa3a6a68c320ba35a09a14d014905
