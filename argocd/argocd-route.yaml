apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`argocd.nara-kosensai.com`)
      middlewares:
        - name: security-headers
      services:
        - name: argocd-server
          port: 80
